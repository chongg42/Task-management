<!doctype html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>WorkFlow - Chi tiết dự án</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 20px 60px rgba(79, 70, 229, 0.1);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .tab-btn.active {
        color: #3525cd;
        border-color: #3525cd;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface">
    <aside
      th:replace="~{fragments/layout :: sidebar(activePage='duAn')}"
    ></aside>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="ml-64 pt-24 pb-12 px-8 min-h-screen">
      <div class="max-w-[1280px] mx-auto">
        <!-- Đầu trang: tên, mô tả, tiến độ (JS đổ dữ liệu) -->
        <section id="project-header" class="mb-8"></section>

        <!-- Tabs -->
        <nav class="border-b border-outline-variant mb-8">
          <div class="flex gap-8 overflow-x-auto no-scrollbar" id="tabs">
            <button
              data-tab="overview"
              class="tab-btn active px-1 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-800 whitespace-nowrap"
            >
              Tổng quan
            </button>
            <button
              data-tab="tasks"
              class="tab-btn px-1 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-800 whitespace-nowrap"
            >
              Công việc <span id="count-tasks"></span>
            </button>
            <button
              data-tab="board"
              class="tab-btn px-1 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-800 whitespace-nowrap"
            >
              Bảng Kanban
            </button>
            <button
              data-tab="files"
              class="tab-btn px-1 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-800 whitespace-nowrap"
            >
              Tài liệu <span id="count-files"></span>
            </button>
            <button
              data-tab="members"
              class="tab-btn px-1 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-800 whitespace-nowrap"
            >
              Thành viên <span id="count-members"></span>
            </button>
            <button
              data-tab="activity"
              class="tab-btn px-1 py-2.5 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-800 whitespace-nowrap"
            >
              Hoạt động
            </button>
          </div>
        </nav>

        <!-- Tổng quan -->
        <section
          id="content-overview"
          class="tab-content grid grid-cols-12 gap-6"
        ></section>

        <!-- Công việc (phân trang từ API) -->
        <section id="content-tasks" class="tab-content hidden">
          <div
            class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden"
          >
            <div
              class="p-4 border-b border-gray-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3"
            >
              <div class="relative w-full sm:w-72">
                <span
                  class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-[18px]"
                  >search</span
                >
                <input
                  id="task-search"
                  type="text"
                  placeholder="Tìm công việc..."
                  class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-primary"
                />
              </div>
              <select
                id="task-status"
                class="px-3 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 bg-white focus:outline-none"
              >
                <option value="">Tất cả trạng thái</option>
                <option value="CAN_LAM">Cần làm</option>
                <option value="DANG_LAM">Đang làm</option>
                <option value="DANG_KIEM_TRA">Đang kiểm tra</option>
                <option value="QUA_HAN">Quá hạn</option>
                <option value="HOAN_THANH">Hoàn thành</option>
              </select>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-gray-600">
                <thead>
                  <tr
                    class="bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-500"
                  >
                    <th class="py-3 px-6">Tên công việc</th>
                    <th class="py-3 px-6">Người thực hiện</th>
                    <th class="py-3 px-6">Hạn chót</th>
                    <th class="py-3 px-6">Trạng thái</th>
                    <th class="py-3 px-6 w-40">Tiến độ</th>
                  </tr>
                </thead>
                <tbody id="table-task" class="divide-y divide-gray-100"></tbody>
              </table>
            </div>
            <div
              id="task-pager"
              class="p-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500"
            ></div>
          </div>
        </section>

        <section id="content-board" class="tab-content hidden"></section>
        <section id="content-files" class="tab-content hidden"></section>
        <section id="content-members" class="tab-content hidden"></section>
        <section id="content-activity" class="tab-content hidden"></section>
      </div>
    </main>

    <!-- Task Detail Modal -->
    <div
      id="taskModal"
      class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-sm flex items-center justify-center p-4"
    >
      <div
        class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative animate-in fade-in zoom-in duration-200"
      >
        <!-- Header -->
        <div class="flex justify-between items-start mb-4">
          <div>
            <span
              id="modalStatusBadge"
              class="text-xs font-bold px-2.5 py-1 rounded-full bg-green-100 text-green-700"
            >
              Hoàn thành
            </span>
            <h3
              id="modalTaskTitle"
              class="text-xl font-bold text-gray-900 mt-2"
            >
              Tiêu đề công việc
            </h3>
          </div>
          <button
            onclick="closeTaskModal()"
            class="text-gray-400 hover:text-gray-600 p-1 rounded-lg"
          >
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <!-- Thông tin Task -->
        <div
          class="space-y-3 mb-4 text-sm text-gray-600 border-y border-gray-100 py-3"
        >
          <div class="flex justify-between">
            <span>Tiến độ:</span>
            <span id="modalTaskProgress" class="font-semibold text-gray-800"
              >100%</span
            >
          </div>
          <div class="flex justify-between">
            <span>Hạn chót:</span>
            <span id="modalTaskDueDate" class="font-semibold text-gray-800"
              >27/10/2026</span
            >
          </div>
        </div>

        <!-- Ô Nhập Comment -->
        <div class="mb-5">
          <label
            class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2"
            >Bình luận / Nhận xét</label
          >
          <textarea
            id="modalCommentInput"
            rows="3"
            class="w-full p-3 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
            placeholder="Nhập phản hồi hoặc nhận xét của bạn..."
          ></textarea>
        </div>

        <!-- Footer / Nút Hành Động -->
        <div class="flex items-center justify-end gap-3 pt-2">
          <button
            id="btnRedo"
            class="px-4 py-2 border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 text-sm font-semibold transition-colors flex items-center gap-1.5"
          >
            <span class="material-symbols-outlined text-base">replay</span>
            Làm lại
          </button>
          <button
            id="btnConfirm"
            class="px-4 py-2 bg-primary text-white rounded-xl hover:bg-primary-container text-sm font-semibold transition-all shadow-md shadow-primary/20 flex items-center gap-1.5"
          >
            <span class="material-symbols-outlined text-base"
              >check_circle</span
            >
            Xác nhận
          </button>
        </div>
      </div>
    </div>
    <script th:src="@{/js/projectDetail.js}"></script>
  </body>
</html>
