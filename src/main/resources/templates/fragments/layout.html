<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <!--
    File này chỉ chứa các fragment dùng chung, không phải một trang độc lập.
    Cách dùng trong từng trang:
      <aside th:replace="~{fragments/layout :: sidebar(activePage='duAn')}"></aside>
      <header th:replace="~{fragments/layout :: header}"></header>
    activePage nhận: tongQuan | duAn | congViec | lich | caiDat
    Sidebar đã nhúng sẵn layout.js (thông tin người dùng, đăng xuất, phím tắt tìm kiếm),
    nên các trang không cần tự nạp script này.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout fragments</title>
  </head>
  <body>
    <!-- ================= SIDEBAR ================= -->
    <aside
      th:fragment="sidebar(activePage)"
      class="h-screen w-64 border-r border-glass-border fixed left-0 top-0 z-40 bg-glass-bg backdrop-blur-xl flex flex-col py-6"
    >
      <a
        th:href="@{/tongquan}"
        class="px-6 mb-10 flex items-center gap-2 text-headline-md font-headline-md font-black text-primary"
      >
        <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1">task_alt</span>
        <span>WorkFlow</span>
      </a>

      <nav class="flex-1 space-y-1" aria-label="Điều hướng chính">
        <a
          th:href="@{/tongquan}"
          th:classappend="${activePage == 'tongQuan'} ? 'active text-primary'"
          th:attr="aria-current=${activePage == 'tongQuan'} ? 'page' : null"
          class="flex items-center gap-3 px-4 py-3 rounded-r-xl text-on-surface-variant hover:text-primary hover:bg-primary/5 transition-colors"
        >
          <span class="material-symbols-outlined">dashboard</span>
          <span class="font-label-lg text-label-lg">Tổng quan</span>
        </a>
        <a
          th:href="@{/duan}"
          th:classappend="${activePage == 'duAn'} ? 'active text-primary'"
          th:attr="aria-current=${activePage == 'duAn'} ? 'page' : null"
          class="flex items-center gap-3 px-4 py-3 rounded-r-xl text-on-surface-variant hover:text-primary hover:bg-primary/5 transition-colors"
        >
          <span class="material-symbols-outlined">folder_copy</span>
          <span class="font-label-lg text-label-lg">Dự án</span>
        </a>
        <a
          th:href="@{/congviec}"
          th:classappend="${activePage == 'congViec'} ? 'active text-primary'"
          th:attr="aria-current=${activePage == 'congViec'} ? 'page' : null"
          class="flex items-center gap-3 px-4 py-3 rounded-r-xl text-on-surface-variant hover:text-primary hover:bg-primary/5 transition-colors"
        >
          <span class="material-symbols-outlined">view_kanban</span>
          <span class="font-label-lg text-label-lg">Công việc</span>
        </a>
        <a
          th:href="@{/lichtrinh}"
          th:classappend="${activePage == 'lich'} ? 'active text-primary'"
          th:attr="aria-current=${activePage == 'lich'} ? 'page' : null"
          class="flex items-center gap-3 px-4 py-3 rounded-r-xl text-on-surface-variant hover:text-primary hover:bg-primary/5 transition-colors"
        >
          <span class="material-symbols-outlined">calendar_today</span>
          <span class="font-label-lg text-label-lg">Lịch</span>
        </a>
        <a
          th:href="@{/caidat}"
          th:classappend="${activePage == 'caiDat'} ? 'active text-primary'"
          th:attr="aria-current=${activePage == 'caiDat'} ? 'page' : null"
          class="flex items-center gap-3 px-4 py-3 rounded-r-xl text-on-surface-variant hover:text-primary hover:bg-primary/5 transition-colors"
        >
          <span class="material-symbols-outlined">settings</span>
          <span class="font-label-lg text-label-lg">Cài đặt</span>
        </a>
      </nav>

      <div class="px-4 mt-auto">
        <!-- Thẻ người dùng: layout.js đổ tên, email, avatar từ /api/user/profile -->
        <a
          th:href="@{/caidat}"
          class="flex items-center gap-3 p-3 glass-card rounded-xl mb-4 border border-glass-border hover:bg-white/80 transition-colors"
        >
          <img
            id="sbAvatar"
            alt=""
            class="w-10 h-10 rounded-full object-cover shrink-0"
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e0e0ff'/%3E%3Ccircle cx='20' cy='15' r='7' fill='%23a5a8d6'/%3E%3Cpath d='M6 38c0-8 6-13 14-13s14 5 14 13z' fill='%23a5a8d6'/%3E%3C/svg%3E"
          />
          <div class="min-w-0">
            <p id="sbName" class="font-label-lg text-label-lg text-on-surface truncate">Đang tải...</p>
            <p id="sbEmail" class="font-body-sm text-body-sm text-on-surface-variant truncate"></p>
          </div>
        </a>

        <button
          type="button"
          id="btnLogout"
          class="w-full flex items-center gap-3 text-error px-4 py-3 hover:bg-error/5 rounded-lg transition-colors disabled:opacity-50"
        >
          <span class="material-symbols-outlined">logout</span>
          <span class="font-label-lg text-label-lg">Đăng xuất</span>
        </button>
      </div>

      <script th:src="@{/js/layout.js}"></script>
    </aside>

    <!-- ================= HEADER ================= -->
    <header
      th:fragment="header"
      class="fixed top-0 right-0 left-64 h-16 z-30 bg-glass-bg backdrop-blur-xl border-b border-glass-border shadow-sm flex items-center justify-between px-margin-desktop"
    >
      <div class="flex items-center w-96 max-w-full relative">
        <span class="material-symbols-outlined absolute left-3 text-on-surface-variant">search</span>
        <input
          id="searchInput"
          type="search"
          autocomplete="off"
          placeholder="Tìm kiếm công việc, dự án..."
          class="w-full bg-surface-container-low border-none rounded-full py-2 pl-10 pr-16 text-sm focus:ring-2 focus:ring-primary transition-all"
        />
        <span id="searchHint" class="absolute right-3 text-[10px] font-bold text-on-surface-variant opacity-50 pointer-events-none">⌘K</span>
      </div>

      <a th:href="@{/caidat}" class="flex items-center gap-3 rounded-full pl-1 pr-3 py-1 hover:bg-surface-container transition-colors">
        <img
          id="hdAvatar"
          alt=""
          class="w-8 h-8 rounded-full border border-primary/20 object-cover"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23e0e0ff'/%3E%3Ccircle cx='20' cy='15' r='7' fill='%23a5a8d6'/%3E%3Cpath d='M6 38c0-8 6-13 14-13s14 5 14 13z' fill='%23a5a8d6'/%3E%3C/svg%3E"
        />
        <span id="hdName" class="font-label-lg text-label-lg"></span>
      </a>
    </header>
  </body>
</html>
