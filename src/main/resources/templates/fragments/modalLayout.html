<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:fragment="modalLayout">
      <div
        class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden"
        id="modal"
      >
        <!-- BEGIN: Main Modal Container -->
        <div
          class="bg-white w-full max-w-4xl max-h-[95vh] rounded-xl shadow-2xl flex flex-col"
          data-purpose="add-project-modal"
        >
          <!-- BEGIN: Progress Stepper -->
          <div
            class="px-12 pt-10 border-b border-gray-50 relative"
            data-purpose="stepper"
          >
            <button
              onclick="closeModal()"
              class="absolute top-4 right-4 w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-red-500 transition-all"
            >
              <span class="material-symbols-outlined text-2xl">close</span>
            </button>
            <div
              class="relative flex justify-between items-center max-w-2xl mx-auto"
            >
              <div class="stepper-line"></div>
              <!-- Step 1: Active -->
              <div class="relative z-10 flex flex-col items-center gap-2 step-icon">
                <div
                  class="w-10 h-10 rounded-full flex items-center justify-center shadow-indigo-200 shadow-lg text-white bg-indigo-600 transition-all duration-300 easi-in"
                >
                  <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    viewbox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" x2="12" y1="8" y2="12"></line>
                    <line x1="12" x2="12.01" y1="16" y2="16"></line>
                  </svg>
                </div>
                <span class="text-xs font-medium text-gray-400">Thông tin</span>
              </div>
              <!-- Step 2: Inactive -->
              <div class="relative z-10 flex flex-col items-center gap-2 step-icon">
                <div
                  class="w-10 h-10 rounded-full bg-white border-2 border-gray-200 text-gray-400 flex items-center justify-center transition-all duration-300 easi-in"
                >
                  <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    viewbox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <line x1="8" x2="21" y1="6" y2="6"></line>
                    <line x1="8" x2="21" y1="12" y2="12"></line>
                    <line x1="8" x2="21" y1="18" y2="18"></line>
                    <line x1="3" x2="3.01" y1="6" y2="6"></line>
                    <line x1="3" x2="3.01" y1="12" y2="12"></line>
                    <line x1="3" x2="3.01" y1="18" y2="18"></line>
                  </svg>
                </div>
                <span class="text-xs font-medium text-gray-400">Quy trình</span>
              </div>
              <!-- Step 3: Inactive -->
              <div class="relative z-10 flex flex-col items-center gap-2 step-icon">
                <div
                  class="w-10 h-10 rounded-full bg-white border-2 border-gray-200 text-gray-400 flex items-center justify-center transition-all duration-300 easi-in"
                >
                  <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    viewbox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" x2="20" y1="8" y2="14"></line>
                    <line x1="23" x2="17" y1="11" y2="11"></line>
                  </svg>
                </div>
                <span class="text-xs font-medium text-gray-400"
                  >Thành viên</span
                >
              </div>
            </div>
          </div>
          <!-- END: Progress Stepper -->
          <!-- BEGIN: Form Content -->
          <div class="p-10 flex-1 overflow-y-auto" id="content">
            <div
              class="max-w-3xl mx-auto border border-gray-100 rounded-2xl p-8 bg-white"
              data-purpose="form-container"
            >
              <div
                th:replace="~{ComponentModal/projectModal::projectModal}"
              ></div>
              <div th:replace="~{ComponentModal/taskModal::taskModal}"></div>
              <div th:replace="~{ComponentModal/doneModal::doneModal}"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
