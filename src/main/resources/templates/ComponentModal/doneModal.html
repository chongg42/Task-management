<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
<body>
    <div th:fragment="doneModal">
      <div id="lastStep" class="hidden">
                <div class="mb-8">
                  <h1 class="text-2xl font-bold text-gray-900">
                    Thiết lập quy trình làm việc
                  </h1>
                  <p class="text-gray-500 mt-2">
                    Xác định các giai đoạn và gán nhân sự cho từng bước.
                  </p>
                </div>
                <!-- BEGIN: Workflow Stages List -->
                <div class="space-y-4" data-purpose="workflow-stages-list" id="listTask">
                  <!-- Stage 1 -->
                </div>
                 <footer class="mt-10 flex justify-end">
          <button
          id="done"
            class="px-10 py-3 bg-blue-700 text-white font-semibold rounded-lg hover:bg-blue-800 transition-colors shadow-lg shadow-blue-200"
            data-purpose="submit-button"
            type="submit"
            onclick="saveProject()"
          >
            Hoàn Thành
          </button>
        </footer>
              </div>
    </div>
</body>
</html>
