<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
<body>
    <div th:fragment="projectModal">
       <div id="firstStep">
                <div class="mb-8">
                  <h2 class="text-2xl font-bold text-slate-800">
                    Bắt đầu với những điều cơ bản
                  </h2>
                  <p class="text-gray-500 mt-1">
                    Đặt tên và mô tả dự án của bạn để mọi người cùng nắm bắt.
                  </p>
                </div>
                <form class="space-y-6">
                  <!-- Project Icon Selector -->
                  <div data-purpose="icon-selector">
                    <label
                      class="block text-xs font-bold text-gray-500 tracking-wider uppercase mb-3"
                      >BIỂU TƯỢNG DỰ ÁN</label
                    >
                    <div class="flex gap-4">
                      <!-- Upload Icon Button -->
                      <button
                        class="w-16 h-16 border-2 border-dashed border-indigo-300 bg-indigo-50 rounded-xl flex flex-col items-center justify-center text-indigo-600 hover:bg-indigo-100 transition-colors"
                        type="button"
                      >
                        <svg
                          class="h-6 w-6"
                          fill="none"
                          stroke="currentColor"
                          viewbox="0 0 24 24"
                          xmlns="http://www.w3.org/2000/svg"
                        >
                          <path
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                          ></path>
                        </svg>
                        <span class="text-[10px] font-bold mt-1">Tải lên</span>
                      </button>
                      <!-- Preset Icons -->
                      <button
                        class="w-12 h-10 mt-3 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center hover:bg-emerald-100"
                        type="button"
                      >
                        <svg
                          class="h-5 w-5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewbox="0 0 24 24"
                          xmlns="http://www.w3.org/2000/svg"
                        >
                          <path
                            d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"
                          ></path>
                          <path
                            d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"
                          ></path>
                          <path
                            d="M9 12H4s.5-1 1-4c1.5 0 3 .5 3 .5L9 12Z"
                          ></path>
                          <path
                            d="M15 15s.5 1.5.5 3c-.5 1-4 1-4 1l3.5-4Z"
                          ></path>
                          <line x1="11.5" x2="15.5" y1="15.5" y2="11.5"></line>
                        </svg>
                      </button>
                      <button
                        class="w-12 h-10 mt-3 bg-orange-50 text-orange-600 rounded-lg flex items-center justify-center hover:bg-orange-100"
                        type="button"
                      >
                        <svg
                          class="h-5 w-5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewbox="0 0 24 24"
                          xmlns="http://www.w3.org/2000/svg"
                        >
                          <path d="M9 18h6"></path>
                          <path d="M10 22h4"></path>
                          <path
                            d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"
                          ></path>
                        </svg>
                      </button>
                      <button
                        class="w-12 h-10 mt-3 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center hover:bg-blue-100"
                        type="button"
                      >
                        <svg
                          class="h-5 w-5"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          viewbox="0 0 24 24"
                          xmlns="http://www.w3.org/2000/svg"
                        >
                          <polyline points="16 18 22 12 16 6"></polyline>
                          <polyline points="8 6 2 12 8 18"></polyline>
                        </svg>
                      </button>
                    </div>
                  </div>
                  <!-- Project Name -->
                  <div data-purpose="input-group">
                    <label
                      class="block text-xs font-bold text-gray-500 tracking-wider uppercase mb-2"
                      for="project-name"
                      >TÊN DỰ ÁN</label
                    >
                    <input
                      class="w-full bg-[#f3f6f9] border-none focus:ring-2 focus:ring-indigo-500 rounded-lg p-4 text-slate-700 placeholder-gray-400 transition-shadow"
                      id="project-name"
                      placeholder="Ví dụ: Tái cấu trúc Website 2024"
                      type="text"
                    />
                  </div>
                  <!-- Short Description -->
                  <div data-purpose="input-group">
                    <label
                      class="block text-xs font-bold text-gray-500 tracking-wider uppercase mb-2"
                      for="project-desc"
                      >MÔ TẢ NGẮN GỌN</label
                    >
                    <textarea
                      class="w-full bg-[#f3f6f9] border-none focus:ring-2 focus:ring-indigo-500 rounded-lg p-4 text-slate-700 placeholder-gray-400 transition-shadow resize-none"
                      id="project-desc"
                      placeholder="Dự án tập trung vào việc cải thiện trải nghiệm người dùng..."
                      rows="4"
                    ></textarea>
                  </div>
                  <!-- Date Pickers Row -->
                  <div class="grid grid-cols-2 gap-6">
                    <div data-purpose="input-group">
                      <label
                        class="block text-xs font-bold text-gray-500 tracking-wider uppercase mb-2"
                        for="start-date"
                        >NGÀY BẮT ĐẦU</label
                      >
                      <div class="relative">
                        <input
                          class="w-full bg-[#f3f6f9] border-none focus:ring-2 focus:ring-indigo-500 rounded-lg p-4 pl-12 text-slate-700 transition-shadow"
                          id="start-date"
                          type="date"
                        />
                        <div
                          class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
                        >
                          <svg
                            class="h-5 w-5"
                            fill="none"
                            stroke="currentColor"
                            viewbox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                          >
                            <path
                              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                            ></path>
                          </svg>
                        </div>
                      </div>
                    </div>
                    <div data-purpose="input-group">
                      <label
                        class="block text-xs font-bold text-gray-500 tracking-wider uppercase mb-2"
                        for="end-date"
                        >NGÀY KẾT THÚC</label
                      >
                      <div class="relative">
                        <input
                          class="w-full bg-[#f3f6f9] border-none focus:ring-2 focus:ring-indigo-500 rounded-lg p-4 pl-12 text-slate-700 transition-shadow"
                          id="end-date"
                          type="date"
                        />
                        <div
                          class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
                        >
                          <svg
                            class="h-5 w-5"
                            fill="none"
                            stroke="currentColor"
                            viewbox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                          >
                            <path
                              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                            ></path>
                          </svg>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- File Upload Area -->
                  <div data-purpose="file-upload">
                    <label
                      class="block text-xs font-bold text-gray-500 tracking-wider uppercase mb-2"
                      >TẢI FILE</label
                    >
                    <input type="file" />
                    <!-- <div
                  class="border-2 border-dashed border-gray-100 rounded-xl p-10 flex flex-col items-center justify-center bg-[#fcfcfc] cursor-pointer hover:bg-gray-50 transition-colors group"
                >
                  <div
                    class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition-transform"
                  >
                    <svg
                      class="h-6 w-6"
                      fill="none"
                      stroke="currentColor"
                      viewbox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                      ></path>
                    </svg>
                  </div>
                  <p class="text-sm text-gray-400">
                    Thả file vào đây hoặc nhấp để tải lên
                  </p>
                </div> -->
                  </div>
                  <!-- Action Buttons -->
                  <div
                    class="flex justify-end pt-4"
                    data-purpose="form-actions"
                  >
                    <button
                      class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-xl flex items-center gap-2 shadow-lg shadow-indigo-200 transition-all active:scale-95"
                      type="button"
                      onclick="getStep(`secondStep`)"
                    >
                      Tiếp tục
                      <svg
                        class="h-5 w-5"
                        fill="none"
                        stroke="currentColor"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2.5"
                        viewbox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <line x1="5" x2="19" y1="12" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                      </svg>
                    </button>
                  </div>
                </form>
              </div>
    </div>
</body>
</html>
