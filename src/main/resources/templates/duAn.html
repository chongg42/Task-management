<!doctype html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>WorkFlow - Dự án</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <style>
      .project-card { transition: transform 0.25s ease, box-shadow 0.25s ease; }
      .project-card:hover { transform: translateY(-4px); box-shadow: 0 30px 80px rgba(79, 70, 229, 0.22); }
    </style>
  </head>
  <body class="bg-background font-body-md text-on-surface">
    <aside th:replace="~{fragments/layout :: sidebar(activePage='duAn')}"></aside>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="ml-64 pt-24 pb-12 px-8 min-h-screen">
      <div class="max-w-7xl mx-auto">
        <!-- Banner + thống kê -->
        <section class="glass-card rounded-3xl p-8 mb-8">
          <div class="flex flex-wrap items-start justify-between gap-4">
            <div>
              <h1 class="font-headline-lg text-headline-lg mb-2">Dự án của bạn 👋</h1>
              <p class="text-on-surface-variant max-w-md">
                Quản lý và theo dõi tiến độ các dự án bạn tham gia.
              </p>
            </div>
            <button id="themDuAn" class="flex items-center gap-2 bg-primary text-white px-5 py-2.5 rounded-xl font-label-lg hover:shadow-lg hover:shadow-primary/20 transition-all active:scale-95">
              <span class="material-symbols-outlined text-sm">add</span>
              Thêm dự án
            </button>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
            <div class="bg-white/60 rounded-2xl p-4 border border-white">
              <span class="text-xs font-bold text-outline uppercase tracking-wider">Tổng dự án</span>
              <p id="stat-total" class="text-2xl font-bold mt-1">—</p>
            </div>
            <div class="bg-white/60 rounded-2xl p-4 border border-white">
              <span class="text-xs font-bold text-outline uppercase tracking-wider">Đang chạy</span>
              <p id="stat-running" class="text-2xl font-bold text-primary mt-1">—</p>
            </div>
            <div class="bg-white/60 rounded-2xl p-4 border border-white">
              <span class="text-xs font-bold text-outline uppercase tracking-wider">Hoàn thành</span>
              <p id="stat-done" class="text-2xl font-bold text-success mt-1">—</p>
            </div>
            <div class="bg-white/60 rounded-2xl p-4 border border-white">
              <span class="text-xs font-bold text-outline uppercase tracking-wider">Trễ hạn</span>
              <p id="stat-late" class="text-2xl font-bold text-danger mt-1">—</p>
            </div>
          </div>
        </section>

        <!-- Bộ lọc + chế độ xem -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
          <div id="status-tabs" class="flex items-center gap-1 bg-surface-container p-1 rounded-xl w-fit">
            <button data-status="" class="px-5 py-2 rounded-lg font-label-lg">Tất cả</button>
            <button data-status="DANG_THUC_HIEN" class="px-5 py-2 rounded-lg font-label-lg">Đang chạy</button>
            <button data-status="TAM_DUNG" class="px-5 py-2 rounded-lg font-label-lg">Tạm dừng</button>
            <button data-status="HOAN_THANH" class="px-5 py-2 rounded-lg font-label-lg">Hoàn thành</button>
          </div>
          <div class="flex items-center bg-surface-container rounded-xl p-1">
            <button id="view-grid" data-view="grid" aria-label="Dạng lưới" class="p-2 rounded-lg"><span class="material-symbols-outlined">grid_view</span></button>
            <button id="view-list" data-view="list" aria-label="Dạng danh sách" class="p-2 rounded-lg"><span class="material-symbols-outlined">list</span></button>
          </div>
        </div>

        <!-- Danh sách dự án (modal.js bắt sự kiện .btn-update bên trong #projects) -->
        <div id="projects" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <p class="col-span-full py-10 text-center text-on-surface-variant">Đang tải dự án...</p>
        </div>

        <!-- Phân trang -->
        <div class="mt-8 flex flex-col md:flex-row items-center justify-between gap-4 p-4 bg-white/70 backdrop-blur-xl border border-white/40 rounded-2xl shadow-sm">
          <div id="range-text" class="text-body-sm text-on-surface-variant"></div>
          <div id="pagination" class="flex items-center gap-1"></div>
          <label class="flex items-center gap-2 text-body-sm text-on-surface-variant">
            Số dự án/trang
            <select id="page-size" class="px-3 py-1.5 bg-surface-container rounded-lg text-sm font-bold border-0">
              <option value="6">6</option>
              <option value="9" selected>9</option>
              <option value="12">12</option>
            </select>
          </label>
        </div>

        <!-- Sắp đến hạn + tiến độ trung bình -->
        <section class="mt-12">
          <h2 class="font-headline-md text-xl mb-6">Tổng quan tiến độ</h2>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="md:col-span-3 glass-card rounded-2xl p-6">
              <span class="font-bold text-label-lg">Dự án sắp đến hạn</span>
              <div id="upcoming" class="space-y-2 mt-4"></div>
            </div>
            <div class="rounded-2xl p-6 bg-primary text-white">
              <p class="text-white/60 text-xs font-bold uppercase tracking-widest mb-2">Tiến độ trung bình</p>
              <h3 id="avg-progress" class="text-3xl font-black mb-3">—</h3>
              <div class="h-2 bg-white/20 rounded-full overflow-hidden"><div id="avg-bar" class="h-full bg-white rounded-full transition-all duration-700" style="width: 0%"></div></div>
              <p id="avg-note" class="text-sm text-white/80 leading-relaxed mt-4"></p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div th:replace="~{fragments/modalLayout::modalLayout}"></div>

    <script th:src="@{/js/project.js}"></script>
    <script th:src="@{/js/modal.js}"></script>
  </body>
</html>
