<!doctype html>

<html class="light" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>WorkFlow - Bảng Kanban</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(79, 70, 229, 0.1);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(79, 70, 229, 0.2);
      }
    </style>
    <link href="css/main.css" />
  </head>
  <script th:src="@{/js/task.js}"></script>
  <body
    class="bg-background text-on-surface font-body-md overflow-hidden flex min-h-screen"
  >
    <!-- Sidebar Navigation -->
    <aside
      th:replace="~{fragments/layout :: sidebar(activePage='congViec')}"
    ></aside>
    <!-- Main Content Wrapper -->
    <div class="flex-1 ml-64 flex flex-col h-screen overflow-hidden">
      <!-- Top Navigation Bar -->
      <header
        class="h-16 bg-glass-bg backdrop-blur-xl border-b border-glass-border flex items-center justify-between px-margin-desktop sticky top-0 z-30"
      >
        <div class="flex items-center flex-1 max-w-xl">
          <div class="relative w-full max-w-md">
            <span
              class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline"
              >search</span
            >
            <input
              class="w-full bg-surface-container border-none rounded-full pl-10 pr-12 py-2 text-body-sm focus:ring-2 focus:ring-primary/20"
              placeholder="Tìm kiếm công việc, dự án..."
              type="text"
            />
            <span
              class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] bg-white px-1.5 py-0.5 border border-outline-variant rounded-md text-outline"
              >⌘K</span
            >
          </div>
        </div>
        <div class="flex items-center gap-4">
          <button
            class="bg-primary text-on-primary px-6 py-2 rounded-full font-label-lg hover:bg-primary-container transition-all active:scale-95 shadow-lg shadow-primary/20"
          >
            Thêm công việc
          </button>
          <div class="flex items-center gap-2">
            <button
              class="p-2 hover:bg-primary/5 rounded-full transition-colors text-on-surface-variant"
            >
              <span class="material-symbols-outlined">dark_mode</span>
            </button>
            <button
              class="p-2 hover:bg-primary/5 rounded-full transition-colors text-on-surface-variant relative"
            >
              <span class="material-symbols-outlined">notifications</span>
              <span
                class="absolute top-2 right-2 w-2 h-2 bg-danger rounded-full ring-2 ring-white"
              ></span>
            </button>
          </div>
          <div
            class="flex items-center gap-3 pl-4 border-l border-outline-variant"
          >
            <div class="text-right">
              <p class="text-label-lg font-label-lg text-on-surface">
                Nguyễn Văn An
              </p>
              <p class="text-[11px] text-outline">Product Manager</p>
            </div>
            <img
              class="w-10 h-10 rounded-full border-2 border-white shadow-sm ring-1 ring-primary/10 object-cover"
              data-alt="A professional headshot of a smiling Vietnamese man in his early 30s wearing a crisp business casual shirt. He is set against a clean, softly blurred modern office background with neutral gray and blue tones. The lighting is bright and even, reinforcing a professional and efficient SaaS environment aesthetic."
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5Nt43HSRehOwtnfHe6UsxKzfA3WJwpp5GoWa8Stm9-waoExy35xyoHuMLt1t47zaW2Ec-eBUcameENheBVB6thgen-v0OEiQuJdt_kt6sa5QTDhLj5XfpyET_3l68ZC_s9DwtXMPJiGHtHy41e7SAfl0egNGugvUO0Cxcy8nxiudC1VQUlYrybfvvJuyMPt2evgpK_f1WX0M2UXUuXZut5BGlZ1PKG4IxfA9AZkQsS-wjeBDg0oT7hoPi0lZ_NPUNxi7kzQLd3Ls"
            />
          </div>
        </div>
      </header>
      <!-- Content Area -->
      <main
        class="flex-1 overflow-x-auto custom-scrollbar bg-[#f8f9fa] relative"
      >
        <!-- Board Header -->
        <div class="px-margin-desktop py-8 flex items-end justify-between">
          <div>
            <nav class="flex items-center gap-2 text-body-sm text-outline mb-2">
              <span>Dự án</span>
              <span class="material-symbols-outlined text-sm"
                >chevron_right</span
              >
              <span class="text-primary font-medium"
                >Quản lý Dự án Website</span
              >
            </nav>
            <h1 class="font-headline-lg text-headline-lg text-on-surface">
              Bảng Kanban Công Việc
            </h1>
          </div>
          <div class="flex items-center gap-4">
            <div class="flex -space-x-3">
              <img
                class="w-8 h-8 rounded-full border-2 border-white"
                data-alt="Close-up portrait of a female UI designer with glasses, professional aesthetic, soft studio lighting, muted office background."
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDkQUZzBXNnCnubbzMDWI5uy2weFE93kyDjjwaZQfX5e7Fx44Lks_-QnzzSgTL_DPDfJ_-8WIO_-NzSccbSmGbdfCMCnuS_1ey1xBTaWVYM7KD6hxJuI8CzE5UGB_3WoM3A06O85jhazKM75HD2hwBjJUuY5Gq9ynjDpuaPheHqz-aC-3jVceB3keb3H7qCmK8C8mUhS-4RRP5a2bP6TeZKnflFz6MDpPpYx-VU8ugzYXd78wIADF61m6up1MTpLOsAaMF97nKszBQ"
              />
              <img
                class="w-8 h-8 rounded-full border-2 border-white"
                data-alt="Portrait of a young male software developer, friendly expression, wearing a hoodie, clean background, modern lighting."
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDyAl2_aG1mQwMUqfZo0WvcHCW_RUKDxVtoLxsqUbkkShggkwq-TK2R4LsfTdEDw9qx3xBalLeQu73II609I_89J1kCknt9QHu4pdvvDHYUICWtUg9bBiX0XmciXgwj4j5NY9JalTC4czissyHLv83Gt6z2Fcq78IU9LuJ70ld3P9sRLg5oJn8EDkCDbcBI7WKhgbcLv-CPBA9ZmBns2tffesNkB0R2waLu1ton2gIoG9P5bb0EFDYOFJ9KH8cmoxpJ4QDprMwdV0"
              />
              <img
                class="w-8 h-8 rounded-full border-2 border-white"
                data-alt="Professional headshot of a female marketing specialist, warm smile, professional attire, modern bright lighting."
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuBirSWGlhstsoqG6igA15Em_B7T85r0unoJBiwzNjmteyDR_sFe04UlPteIy-Uf6rM96LbyKlY0j90cAZJKnrhYo3zfPiqaE77BqsKDG7GiVNgwPYbJTsAfZFnz_9pysdhbobYhKOkZZHpirkb3Z308dC6Voe7tXqKdGcqdla9c1p8OvOTvZPhecMbLkDDAoUUF3sYznKqo4FqsfTrlnrOi4Vy2lY52JNbVkbbBCqyRYMNbOkYvYV_UFN4ff7X4lzb-KLZUaWReCME"
              />
              <div
                class="w-8 h-8 rounded-full bg-primary-fixed text-primary flex items-center justify-center text-[10px] font-bold border-2 border-white"
              >
                +12
              </div>
            </div>
            <button
              class="flex items-center gap-2 px-4 py-2 bg-white border border-glass-border rounded-lg text-label-lg hover:shadow-sm transition-all"
            >
              <span class="material-symbols-outlined text-lg">filter_alt</span>
              Bộ lọc
            </button>
            <button
              class="flex items-center gap-2 px-4 py-2 bg-white border border-glass-border rounded-lg text-label-lg hover:shadow-sm transition-all"
            >
              <span class="material-symbols-outlined text-lg">share</span>
              Chia sẻ
            </button>
          </div>
        </div>
        <!-- Kanban Grid -->
        <div
          class="px-margin-desktop grid grid-cols-4 gap-gutter min-w-[1200px] pb-12 items-start"
        >
          <!-- Column: Todo -->
          <div class="flex flex-col gap-4" id="kanban-todo">
            <div class="flex items-center justify-between px-2">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-outline"></span>
                <h2
                  class="font-label-lg text-label-lg uppercase tracking-wider text-outline"
                >
                  Cần làm
                </h2>
                <span
                  class="bg-surface-container px-2 py-0.5 rounded text-[11px] font-bold text-outline"
                  >3</span
                >
              </div>
              <button class="p-1 hover:bg-primary/5 rounded transition-colors">
                <span class="material-symbols-outlined text-lg">add</span>
              </button>
            </div>
            <!-- Card 1 -->
          </div>
          <!-- Column: In Progress -->
          <div class="flex flex-col gap-4" id="kanban-inprogress">
            <div class="flex items-center justify-between px-2">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-secondary"></span>
                <h2
                  class="font-label-lg text-label-lg uppercase tracking-wider text-outline"
                >
                  Đang thực hiện
                </h2>
                <span
                  class="bg-surface-container px-2 py-0.5 rounded text-[11px] font-bold text-outline"
                  >2</span
                >
              </div>
              <button class="p-1 hover:bg-primary/5 rounded transition-colors">
                <span class="material-symbols-outlined text-lg">add</span>
              </button>
            </div>
            <!-- Card 3 -->
          </div>
          <!-- Column: Review -->
          <div class="flex flex-col gap-4" id="kanban-review">
            <div class="flex items-center justify-between px-2">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-warning"></span>
                <h2
                  class="font-label-lg text-label-lg uppercase tracking-wider text-outline"
                >
                  Kiểm duyệt
                </h2>
                <span
                  class="bg-surface-container px-2 py-0.5 rounded text-[11px] font-bold text-outline"
                  >1</span
                >
              </div>
              <button class="p-1 hover:bg-primary/5 rounded transition-colors">
                <span class="material-symbols-outlined text-lg">add</span>
              </button>
            </div>
            <!-- Card 4 -->
          </div>
          <!-- Column: Completed -->
          <div class="flex flex-col gap-4" id="kanban-done">
            <div class="flex items-center justify-between px-2">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-success"></span>
                <h2
                  class="font-label-lg text-label-lg uppercase tracking-wider text-outline"
                >
                  Hoàn thành
                </h2>
                <span
                  class="bg-surface-container px-2 py-0.5 rounded text-[11px] font-bold text-outline"
                  >5</span
                >
              </div>
            </div>
            <!-- Card 5 -->
          </div>
        </div>
      </main>
    </div>
    <!-- Floating Action Button for Mobile Context (though not active in this desktop view per instructions, keep layout readiness) -->
    <button
      class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-xl shadow-primary/40 z-50 transition-transform active:scale-95"
    >
      <span class="material-symbols-outlined text-2xl">add</span>
    </button>
    <script>
      // Micro-interactions and atmospheric logic
      document.addEventListener("DOMContentLoaded", () => {
        const cards = document.querySelectorAll(".glass-card");
        cards.forEach((card) => {
          card.addEventListener("mouseenter", () => {
            // Subtle ripple or elevation change handled by tailwind classes
          });
        });

        // Search Bar micro-interaction
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener("focus", () => {
          searchInput.parentElement.classList.add("ring-2", "ring-primary/20");
        });
        searchInput.addEventListener("blur", () => {
          searchInput.parentElement.classList.remove(
            "ring-2",
            "ring-primary/20",
          );
        });
      });
    </script>
  </body>
</html>
