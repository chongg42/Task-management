<!doctype html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>WorkFlow - Lịch làm việc</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script th:src="@{/js/tailwind-config.js}"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <style>
      body { font-family: "Inter", sans-serif; }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        display: inline-block;
        vertical-align: middle;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 20px 60px rgba(79, 70, 229, 0.12);
      }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .view-btn.on { background: #fff; color: #3525cd; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
    </style>
  </head>
  <body class="bg-background text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed">
    <aside th:replace="~{fragments/layout :: sidebar(activePage='lich')}"></aside>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="ml-64 min-h-screen">
      <div class="pt-24 pb-10 px-8 flex flex-col xl:flex-row gap-6">
        <!-- Cột trái: lịch + danh sách -->
        <div class="flex-1 min-w-0">
          <section class="glass-card rounded-3xl p-6 mb-6">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
              <div>
                <h1 id="cal-title" class="text-2xl font-semibold text-primary"></h1>
                <p id="cal-sub" class="text-sm text-on-surface-variant mt-1"></p>
              </div>
              <div class="flex items-center gap-2">
                <div class="flex bg-surface-container-low p-1 rounded-xl" id="view-switch">
                  <button data-view="month" class="view-btn px-4 py-1.5 text-xs font-semibold rounded-lg text-on-surface-variant">Tháng</button>
                  <button data-view="week" class="view-btn px-4 py-1.5 text-xs font-semibold rounded-lg text-on-surface-variant">Tuần</button>
                  <button data-view="day" class="view-btn px-4 py-1.5 text-xs font-semibold rounded-lg text-on-surface-variant">Ngày</button>
                </div>
                <div class="flex items-center gap-1 border-l border-glass-border pl-2 ml-1">
                  <button data-nav="prev" aria-label="Trước" class="p-2 hover:bg-surface-container rounded-lg"><span class="material-symbols-outlined">chevron_left</span></button>
                  <button data-nav="today" class="px-3 py-2 text-xs font-semibold hover:bg-surface-container rounded-lg">Hôm nay</button>
                  <button data-nav="next" aria-label="Sau" class="p-2 hover:bg-surface-container rounded-lg"><span class="material-symbols-outlined">chevron_right</span></button>
                </div>
              </div>
            </div>
            <div id="cal-body" class="border border-glass-border rounded-2xl overflow-hidden bg-white">
              <p class="p-10 text-center text-sm text-on-surface-variant">Đang tải lịch...</p>
            </div>
          </section>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <section class="glass-card rounded-3xl p-6">
              <h3 class="font-semibold text-primary mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined">event_available</span>
                <span id="day-title">Công việc trong ngày</span>
              </h3>
              <div id="day-list" class="space-y-3"></div>
            </section>
            <section class="glass-card rounded-3xl p-6">
              <h3 class="font-semibold text-primary mb-4 flex items-center gap-2">
                <span class="material-symbols-outlined">format_list_bulleted</span>
                Deadline sắp tới
              </h3>
              <div id="upcoming" class="space-y-1"></div>
            </section>
          </div>
        </div>

        <!-- Cột phải: lịch nhỏ + bộ lọc -->
        <aside class="w-full xl:w-80 flex flex-col gap-6 shrink-0">
          <section class="glass-card rounded-3xl p-6">
            <div class="flex items-center justify-between mb-4">
              <h4 id="mini-title" class="font-bold text-sm"></h4>
              <div class="flex gap-1">
                <button data-mini="prev" aria-label="Tháng trước" class="p-1 hover:bg-surface-container rounded"><span class="material-symbols-outlined text-[18px]">chevron_left</span></button>
                <button data-mini="next" aria-label="Tháng sau" class="p-1 hover:bg-surface-container rounded"><span class="material-symbols-outlined text-[18px]">chevron_right</span></button>
              </div>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center mb-2 text-[10px] font-bold text-on-surface-variant">
              <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span class="text-secondary">CN</span>
            </div>
            <div id="mini-grid" class="grid grid-cols-7 gap-1 text-center"></div>
          </section>

          <section class="glass-card rounded-3xl p-6">
            <h4 class="font-bold text-sm mb-3">Dự án</h4>
            <div id="filter-projects" class="space-y-2 text-sm"></div>
          </section>

          <section class="glass-card rounded-3xl p-6">
            <h4 class="font-bold text-sm mb-3">Trạng thái</h4>
            <div id="filter-status" class="space-y-2 text-sm"></div>
          </section>
        </aside>
      </div>
    </main>

    <script th:src="@{/js/lich.js}"></script>
  </body>
</html>
